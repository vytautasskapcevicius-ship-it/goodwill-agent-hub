<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodwill Financial — Sales Deck</title><style>
:root{--navy:#0B2545;--navy2:#14365e;--gold:#C9A227;--gray:#9aa6b6;}
*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;}
body{background:#070f1c;color:#fff;font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--navy);border-bottom:3px solid var(--gold);flex:none;}
.brand{font-weight:700;letter-spacing:.5px;font-size:15px;}.brand small{display:block;color:var(--gold);font-size:9px;letter-spacing:1.5px;}
header .meta{font-size:12px;color:var(--gray);}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:18px;min-height:0;}
.slidewrap{position:relative;max-width:100%;max-height:100%;aspect-ratio:16/9;box-shadow:0 18px 60px rgba(0,0,0,.6);border-radius:6px;overflow:hidden;background:#000;}
.slidewrap img{display:block;width:100%;height:100%;object-fit:contain;}
.nav{position:absolute;top:0;bottom:0;width:13%;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,0);font-size:40px;transition:.15s;z-index:5;}
.nav:hover{background:rgba(0,0,0,.18);color:rgba(255,255,255,.85);}.nav.prev{left:0;}.nav.next{right:0;}
#hot{position:absolute;inset:0;pointer-events:none;z-index:6;}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:8px;transition:.12s;}
.hotspot:hover{background:rgba(201,162,39,.20);outline:2px solid var(--gold);}
.notes{flex:none;background:#0e1b30;border-top:1px solid #1d2c45;color:#cdd7e6;font-size:14px;line-height:1.5;padding:14px 22px;max-height:26vh;overflow:auto;display:none;}
.notes.show{display:block;}.notes b{color:var(--gold);}
footer{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px;background:var(--navy);border-top:1px solid #1d2c45;font-size:13px;}
.ctrls{display:flex;gap:8px;align-items:center;}
button.btn{background:var(--navy2);color:#fff;border:1px solid #2b446b;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
button.btn:hover{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700;}
.counter{font-variant-numeric:tabular-nums;color:var(--gray);min-width:64px;text-align:center;}
.title{color:#fff;font-weight:600;}.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:42vw;}
.dot{width:9px;height:9px;border-radius:50%;background:#2b446b;border:none;cursor:pointer;padding:0;}.dot.active{background:var(--gold);}
.hint{color:var(--gray);font-size:11px;}
</style></head><body>
<header><div class="brand">GOODWILL FINANCIAL <small>LIVING BENEFITS TEAM</small></div>
<div class="meta">Sales concepts deck · Protect Today, Prepare for Tomorrow</div></header>
<div class="stage"><button class="nav prev" id="prev">‹</button>
<div class="slidewrap"><img id="slide" src="" alt="slide"><div id="hot"></div></div>
<button class="nav next" id="next">›</button></div>
<div class="notes" id="notes"></div>
<footer><div class="ctrls"><button class="btn" id="bPrev">◀ Prev</button><button class="btn" id="bNext">Next ▶</button>
<span class="counter" id="counter"></span><span class="title" id="title"></span></div>
<div class="dots" id="dots"></div>
<div class="ctrls"><button class="btn" id="bNotes">Speaker notes (N)</button><button class="btn" id="bFull">Fullscreen (F)</button><span class="hint">← →</span></div></footer>
<script>
const titles=["Cover", "Who we are", "Total Protection Principle", "Carriers \u2014 P&C", "Carriers \u2014 Life", "Carriers \u2014 Health", "Where we serve", "What makes us different", "The three needs we solve", "Our solutions at a glance", "Concept: Term Life Insurance", "Concept: Permanent Life Insurance (IUL)", "Term vs. Permanent", "Concept: Mortgage Protection", "Concept: Limited-Pay IUL", "Concept: IUL for Retirement Income", "Concept: Living Benefits", "Concept: Business Owner Solutions", "Concept: Annuities & Retirement Rollovers", "Protect today, prepare for tomorrow", "How it works", "Next steps", "Disclosures"];const notes=["Open warm, thank them, set the agenda, confirm their time. This is a flexible deck \u2014 present the intro + the 2-3 concepts that fit this prospect; you don't have to show every slide. Replace [Client Name]/[Date] before the call.", "Build trust fast: independent (objective), local, family-owned, multilingual. Keep it short.", "People buy insurance one piece at a time and end up with gaps. We protect the whole household. The gold pills (Life, Retirement) are where most families are least covered.", "We shop dozens of A-rated carriers so you get the right coverage at the right price \u2014 including specialty trucking/commercial markets (Northland, Canal, GUARD). Because we're independent, we compare them for you.", "Our living-benefits life business runs through Alliance Group. National Life Group is the foundation (175+ yrs, A+, #1 IUL). NOTE for Vytas: research shows Corebridge is not on Alliance Group's public carrier list \u2014 confirm you have that appointment, or I'll swap it for GPM Life / Transamerica which ARE on the list.", "Round out 'total protection' with health: BCBS, Humana, UnitedHealthcare, Aetna. Good cross-sell anchor for business owners and families.", "Footprint = union of the firm (Goodwill Financial Group) + Vytas's producer licenses, ACTIVE states only. Source: SureLC. Excluded: Colorado firm license (expired 06/01/2026) \u2014 though Vytas's personal CO license is active, so CO is included via the union. Note: Arizona active but lapses 06/30/2026. 26 states gold on the map, Illinois navy = home. Re-run with updated state list if licensing changes.", "Signature line \u2014 say it out loud: 'life insurance you don't have to die to use.' Rotary vs smartphone lands with everyone. COMPLIANCE: say 'may' \u2014 Living Benefits are optional riders, vary by product/state, and reduce the death benefit when used.", "National Life's three-need framework \u2014 the backbone of every concept that follows. Tie each prospect's situation to one or more of these.", "This is the menu \u2014 'easy to use.' In PowerPoint AND the web viewer each card is clickable and jumps to that concept. Point to the one that fits the prospect; you rarely present all in one meeting.", "Term is the right tool for many budgets \u2014 say so. It's the entry point; many clients later convert part of it to permanent. COMPLIANCE: most term never pays out (people outlive it).", "COMPLIANCE LANDMINE: IUL is life insurance, NOT an investment, and does not directly participate in the stock market. It has a cap and a floor. Illustrated values are non-guaranteed. Loans/withdrawals reduce cash value and death benefit.", "Be honest \u2014 don't bash term. The mortgage-payment analogy works: a mortgage = escrow + interest + principal (principal builds equity); permanent = cost of insurance + riders + cash value that builds.", "Pivot: 'your homeowners policy protects the house; what protects the mortgage payment?' Discovery: mortgage balance, monthly payment INCLUDING escrow, who's on the loan. Position the field-underwriter role.", "COMPLIANCE LANDMINE: do NOT promise the policy is 'paid up' or guaranteed to never need premium \u2014 continuation depends on funding and performance; illustrated values are non-guaranteed. Always show a carrier illustration with guaranteed AND non-guaranteed columns.", "The LIRP / tax-free retirement concept. COMPLIANCE: don't call IUL an investment; 'tax-free' = properly-structured policy loans, not a guarantee; loans/withdrawals reduce cash value & death benefit; lapse with a loan can be taxable; refer tax questions to a professional.", "The emotional peak and the differentiator. COMPLIANCE: optional riders (ABR); reduce death benefit/cash value; may be taxable; may affect public-assistance; depend on product/state/claim-time. Never say 'free' or 'guaranteed payout.'", "Bridges to your P&C commercial book \u2014 same owner, deeper relationship. Use the Business Fact Finder. Refer tax/legal structuring to the client's CPA/attorney.", "COMPLIANCE: fixed indexed annuities don't directly participate in equities; guaranteed income riders are subject to conditions and rider charges; all guarantees depend on the issuer's claims-paying ability.", "The summary slide. Whatever concept you presented, land here: the same plan protects the family now and builds for later.", "De-risk the decision: short, transparent, pressure-free. Step 1 is today/next; step 5 shows we stick around.", "End with ONE concrete next step \u2014 book the follow-up. Restate 'no obligation.' Referral ask one name at a time. Swap presenter block if another agent uses this deck.", "Keep in the file. Read/provide whenever you show numbers or illustrations. Carrier logos shown under nominative fair use to indicate represented carriers."];const HOTSPOTS={"9": [{"x": 4.5, "y": 38.0, "w": 44.63, "h": 10.93, "go": 10}, {"x": 51.0, "y": 38.0, "w": 44.63, "h": 10.93, "go": 11}, {"x": 4.5, "y": 51.33, "w": 44.63, "h": 10.93, "go": 13}, {"x": 51.0, "y": 51.33, "w": 44.63, "h": 10.93, "go": 14}, {"x": 4.5, "y": 64.67, "w": 44.63, "h": 10.93, "go": 15}, {"x": 51.0, "y": 64.67, "w": 44.63, "h": 10.93, "go": 16}, {"x": 4.5, "y": 78.0, "w": 44.63, "h": 10.93, "go": 17}, {"x": 51.0, "y": 78.0, "w": 44.63, "h": 10.93, "go": 18}]};const N=titles.length;let i=0;
const img=document.getElementById('slide'),counter=document.getElementById('counter'),titleEl=document.getElementById('title'),notesEl=document.getElementById('notes'),dotsEl=document.getElementById('dots');
for(let k=0;k<N;k++){const d=document.createElement('button');d.className='dot'+(k===0?' active':'');d.onclick=()=>go(k);dotsEl.appendChild(d);}
function render(){img.src=`slides2/Slide${i+1}.PNG`;counter.textContent=`${i+1} / ${N}`;titleEl.textContent=titles[i]||'';notesEl.innerHTML=notes[i]||'';[...dotsEl.children].forEach((d,k)=>d.classList.toggle('active',k===i));renderHots();}
function renderHots(){const h=document.getElementById('hot');h.innerHTML='';const list=HOTSPOTS[i];if(!list)return;for(const s of list){const a=document.createElement('div');a.className='hotspot';a.style.left=s.x+'%';a.style.top=s.y+'%';a.style.width=s.w+'%';a.style.height=s.h+'%';a.title='Open concept';a.onclick=(e)=>{e.stopPropagation();go(s.go);};h.appendChild(a);}}
function go(n){i=Math.max(0,Math.min(N-1,n));render();}function next(){go(i+1);}function prev(){go(i-1);}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;document.getElementById('bNext').onclick=next;document.getElementById('bPrev').onclick=prev;
document.getElementById('bNotes').onclick=()=>notesEl.classList.toggle('show');
document.getElementById('bFull').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){next();e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){prev();e.preventDefault();}else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(N-1);}else if(k==='n'){notesEl.classList.toggle('show');}else if(k==='f'){document.getElementById('bFull').click();}});
render();
</script></body></html>
