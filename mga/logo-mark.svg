      <stop offset="0%" stop-color="#223859"/>
      <stop offset="100%" stop-color="#0E1A2C"/>
    </linearGradient>
    <linearGradient id="shield-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
